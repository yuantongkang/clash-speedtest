name: speedtest

on:
  schedule:
    # Note: GitHub Actions schedule uses UTC.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      config:
        description: "Optional. Override secret CLASH_SPEEDTEST_CONFIG (config/subscription URL)."
        required: false
      gist_address:
        description: "Optional. Override secret CLASH_SPEEDTEST_GIST_ADDRESS (Gist address or id)."
        required: false
      repo_address:
        description: "Optional. Override secret CLASH_SPEEDTEST_REPO_ADDRESS (owner/repo or full repo address)."
        required: false
      repo_file_path:
        description: "Optional. Override secret CLASH_SPEEDTEST_REPO_FILE_PATH (repo file path)."
        required: false
      repo_branch:
        description: "Optional. Override secret CLASH_SPEEDTEST_REPO_BRANCH (repo branch)."
        required: false

permissions:
  contents: read

concurrency:
  group: speedtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run clash-speedtest
        shell: bash
        run: |
          set -euo pipefail

          config_input="${{ github.event.inputs.config }}"
          config_secret="${{ secrets.CLASH_SPEEDTEST_CONFIG }}"
          config="${config_input:-$config_secret}"

          if [[ -z "${config}" ]]; then
            echo "Missing required: workflow_dispatch input 'config' or secret CLASH_SPEEDTEST_CONFIG" >&2
            exit 1
          fi

          gist_token="${{ secrets.CLASH_SPEEDTEST_GIST_TOKEN }}"
          gist_address_input="${{ github.event.inputs.gist_address }}"
          gist_address_secret="${{ secrets.CLASH_SPEEDTEST_GIST_ADDRESS }}"
          gist_address="${gist_address_input:-$gist_address_secret}"

          repo_token="${{ secrets.CLASH_SPEEDTEST_REPO_TOKEN }}"
          repo_address_input="${{ github.event.inputs.repo_address }}"
          repo_address_secret="${{ secrets.CLASH_SPEEDTEST_REPO_ADDRESS }}"
          repo_address="${repo_address_input:-$repo_address_secret}"

          repo_file_path_input="${{ github.event.inputs.repo_file_path }}"
          repo_file_path_secret="${{ secrets.CLASH_SPEEDTEST_REPO_FILE_PATH }}"
          repo_file_path="${repo_file_path_input:-$repo_file_path_secret}"

          repo_branch_input="${{ github.event.inputs.repo_branch }}"
          repo_branch_secret="${{ secrets.CLASH_SPEEDTEST_REPO_BRANCH }}"
          repo_branch="${repo_branch_input:-$repo_branch_secret}"

          out_yaml="result.yaml"
          out_tsv="result.tsv"

          args=(
            -c "${config}"
            -output "${out_yaml}"
          )

          if [[ -n "${gist_token}" && -n "${gist_address}" ]]; then
            args+=(-gist-token "${gist_token}" -gist-address "${gist_address}")
          fi

          if [[ -n "${repo_token}" && -n "${repo_address}" ]]; then
            args+=(-repo-token "${repo_token}" -repo-address "${repo_address}")

            if [[ -n "${repo_file_path}" ]]; then
              args+=(-repo-file-path "${repo_file_path}")
            fi

            if [[ -n "${repo_branch}" ]]; then
              args+=(-repo-branch "${repo_branch}")
            fi
          fi

          # Pipe through tee to force non-interactive TSV output in CI.
          go run . "${args[@]}" | tee "${out_tsv}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speedtest-result
          path: |
            result.yaml
            result.tsv
          if-no-files-found: warn
